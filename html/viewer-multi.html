<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ============================================ -->
    <!-- SECTION 1: PAGE SETTINGS                     -->
    <!-- This section contains basic page information -->
    <!-- ============================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annikki | Room Temperature Monitor</title>

    <!-- ProtoFlow Server Configuration -->
    <meta name="protoflow-websocket-url" content="wss://gamma.proto.aalto.fi/ws/app">

    <style>
        /* ============================================ */
        /* SECTION 2: STYLES (how things look)         */
        /* CSS controls colors, sizes, and layout      */
        /* ============================================ */

        /* --- Page Background and Text --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4f8;  /* TRY: #1a1a2e for dark mode */
            color: #333;         /* TRY: #ffffff for dark mode */
            min-height: 100vh;
            padding: 20px;
        }

        /* --- Main Container --- */
        .container {
            max-width: 1000px;   /* Wider than viewer.html to fit several cards */
            margin: 0 auto;
        }

        /* --- Page Header --- */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;     /* TRY: Make it bigger! 48px */
            font-weight: 600;
            color: #2d3748;      /* TRY: #4a90d9 for blue */
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
        }

        /* --- Cards (the boxes that show sensor data) --- */
        .card {
            background: white;           /* TRY: #2d2d44 for dark cards */
            border-radius: 16px;         /* TRY: 0px for sharp corners */
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);  /* This makes the shadow */
        }

        .card-title {
            font-size: 14px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        /* --- Connection Status --- */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #cbd5e0;
        }

        .status-dot.connected {
            background: #48bb78;  /* Green when connected */
        }

        .status-dot.connecting {
            background: #ed8936;  /* Orange when connecting */
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 14px;
            color: #718096;
        }

        /* --- Buttons --- */
        button {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
        }

        .btn-primary {
            background: #4a90d9;  /* TRY: #48bb78 for green */
            color: white;
        }

        .btn-primary:hover {
            background: #3182ce;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
        }

        /* --- Device Picker Dropdown --- */
        .device-picker {
            display: none;
            margin-top: 16px;
        }

        .device-picker.visible {
            display: block;
        }

        .device-picker select {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        .device-picker select:focus {
            outline: none;
            border-color: #4a90d9;
        }

        /* --- Device Summary (above the sensor cards) --- */
        .device-summary {
            display: none;
            font-size: 14px;
            color: #718096;
            text-align: center;
            margin: 8px 0 16px;
        }

        .device-summary.visible {
            display: block;
        }

        /* --- Sensor Grid (one card per sensor) --- */
        /* auto-fill makes as many columns as fit: 1 on a phone, 2-3 on a laptop */
        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));  /* TRY: 400px for bigger cards */
            gap: 16px;
        }

        .sensor-grid .card {
            margin-bottom: 0;   /* The grid gap already spaces the cards */
        }

        .value-display {
            font-size: 56px;     /* Smaller than viewer.html so cards fit side by side */
            font-weight: 700;
            text-align: center;
            color: #2d3748;
            line-height: 1;
            margin: 20px 0;
            overflow-wrap: anywhere;
        }

        .value-display.small {
            font-size: 18px;     /* For object values like IMU data */
            font-weight: 500;
            font-family: monospace;
            text-align: left;
            white-space: pre-wrap;
        }

        .value-unit {
            font-size: 20px;
            font-weight: 400;
            color: #718096;
            margin-left: 4px;
        }

        /* --- Progress Bar (for number sensors) --- */
        .progress-bar {
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 16px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a90d9, #63b3ed);  /* TRY: #48bb78, #68d391 for green */
            border-radius: 6px;
            transition: width 0.15s ease;
            width: 0%;
        }

        .range-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0aec0;
            margin-top: 6px;
        }

        /* Different bar colors per sensor kind */
        .kind-temperature .progress-fill {
            background: linear-gradient(90deg, #ed8936, #e53e3e);  /* Warm colors */
        }

        .kind-humidity .progress-fill {
            background: linear-gradient(90deg, #38b2ac, #4299e1);  /* Water colors */
        }

        /* --- Button State (for button sensor) --- */
        .button-state {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .button-indicator {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            color: #718096;
            transition: all 0.15s ease;
        }

        .button-indicator.pressed {
            background: #48bb78;
            color: white;
            transform: scale(0.95);
            box-shadow: 0 0 0 8px rgba(72, 187, 120, 0.2);
        }

        /* --- Motion State (for PIR sensor) --- */
        .motion-indicator {
            text-align: center;
            padding: 24px;
        }

        .motion-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .motion-text {
            font-size: 18px;
            font-weight: 500;
            color: #718096;
        }

        .motion-indicator.detected .motion-icon {
            animation: shake 0.5s ease-in-out;
        }

        .motion-indicator.detected .motion-text {
            color: #e53e3e;
            font-weight: 600;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* --- Last Update Time (bottom of each card) --- */
        .device-info {
            font-size: 12px;
            color: #a0aec0;
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }

        /* --- Sensor Type Badge --- */
        .sensor-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #edf2f7;
            color: #4a5568;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        /* Card flashes briefly when a new value arrives */
        .sensor-grid .card.updated {
            box-shadow: 0 0 0 2px #63b3ed, 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #a0aec0;
            font-size: 12px;
        }

        footer a {
            color: #4a90d9;
            text-decoration: none;
        }

        /* --- Responsive (smaller screens) --- */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .value-display {
                font-size: 44px;
            }
            h1 {
                font-size: 22px;
            }
        }
        :root {
            --annikki-teal: #1d4746;
            --annikki-pink: #ddb3b1;
            --annikki-paper: #f7f2ee;
            --annikki-ink: #203d3b;
        }

        body {
            background: var(--annikki-paper);
            color: var(--annikki-ink);
            padding: clamp(16px, 4vw, 48px);
        }

        .container {
            max-width: 1180px;
        }

        .monitor-toolbar,
        .monitor-controls {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .monitor-toolbar {
            justify-content: space-between;
            margin: 0 0 24px;
            text-align: left;
        }

        .monitor-toolbar h1 {
            margin: 0;
            color: var(--annikki-ink);
            font: 400 clamp(1.7rem, 4vw, 2.65rem)/1.1 Georgia, serif;
        }

        .connection-status,
        .monitor-controls .device-picker {
            margin: 0;
        }

        .connection-status .status-text {
            color: #435c59;
        }

        .monitor-controls .btn-primary,
        .monitor-controls .btn-primary:hover {
            background: var(--annikki-teal);
            color: white;
        }

        .monitor-controls .btn-primary:disabled {
            opacity: .65;
        }

        .monitor-toolbar :focus-visible {
            outline: 2px solid var(--annikki-teal);
            outline-offset: 3px;
        }

        .monitor-layout {
            display: grid;
            grid-template-columns: minmax(0, 4fr) minmax(0, 5fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .brand-art {
            position: relative;
            min-height: 320px;
            overflow: hidden;
            border-radius: 24px;
            background: var(--annikki-teal);
        }

        .brand-art img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.18);
        }

        .room-display {
            min-width: 0;
            padding: clamp(20px, 4vw, 44px);
            border-radius: 24px;
            background: var(--annikki-teal);
            color: #fff7f3;
            text-align: center;
        }

        .monitor-layout[data-alarm] {
            --alarm-red: #722d3b;
        }

        .monitor-layout[data-alarm] .room-display,
        .monitor-layout[data-alarm] .brand-art {
            background: var(--alarm-red);
        }

        .monitor-layout[data-alarm] .brand-art img {
            filter: grayscale(1);
            mix-blend-mode: luminosity;
        }

        .room-display h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        .room-temperature {
            margin: 8px 0 12px;
            font: 400 clamp(2rem, 6vw, 5.5rem)/1.06 Georgia, serif;
            color: var(--annikki-pink);
            font-variant-numeric: tabular-nums;
        }

        .room-alarm {
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 700;
            margin-bottom: 12px;
        }

        .room-trend {
            max-width: 620px;
            margin: 24px auto 0;
            padding: 12px 12px 4px;
            border: 1px solid #fff7f33b;
            border-radius: 16px;
            background: #0a211f33;
            font-size: .875rem;
        }

        .room-trend canvas {
            display: block;
            width: 100%;
            height: 136px;
            margin-top: 8px;
        }

        @media (max-width: 720px) {
            .monitor-layout {
                grid-template-columns: 1fr;
            }

            .brand-art {
                min-height: 0;
                aspect-ratio: 2.4;
            }
        }
    </style>
</head>
<body>
    <!-- ============================================ -->
    <!-- SECTION 3: CONTENT (what you see on page)   -->
    <!-- HTML defines the structure of the page      -->
    <!-- ============================================ -->

    <div class="container">
        <header class="monitor-toolbar">
            <h1>Room Temperature Monitor</h1>
            <div class="monitor-controls">
                <div class="status-bar connection-status" role="status">
                    <span class="status-dot" id="status-dot" aria-hidden="true"></span>
                    <span class="status-text" id="status-text">Disconnected</span>
                </div>
                <button class="btn-primary" id="connect-btn">Connect</button>
                <div class="device-picker" id="device-picker">
                    <select id="device-select" aria-label="Device">
                        <option value="">Select your device...</option>
                    </select>
                </div>
            </div>
        </header>

        <main>
            <div class="monitor-layout" id="monitor-layout">
                <div class="brand-art">
                    <img src="assets/annikki-brand.png" alt="Annikki. Smart care, simply there." width="3429" height="3429">
                </div>
                <section class="room-display" id="room-display" aria-label="Annikki1 readings">
                    <h2>Room temperature</h2>
                    <p class="room-temperature" id="room-temperature">No data yet</p>
                    <p class="room-alarm" id="room-alarm" role="status">Waiting for alarm status</p>
                    <figure class="room-trend">
                        <figcaption>Live temperature · Last 2 minutes</figcaption>
                        <canvas id="room-trend" role="img" aria-label="Recent room temperature readings with alarm thresholds at 15 °C and 27 °C"></canvas>
                    </figure>
                </section>
            </div>

            <!-- Which device we are showing, and how many sensors it has -->
            <p class="device-summary" id="device-summary"></p>

            <!-- Sensor Cards: empty here, JavaScript adds one card per sensor -->
            <div class="sensor-grid" id="sensor-grid"></div>
        </main>
    </div>

    <!-- ============================================ -->
    <!-- SECTION 4: BEHAVIOR (how the page works)    -->
    <!-- JavaScript makes the page interactive       -->
    <!-- ============================================ -->

    <!-- Load ProtoFlow library from server -->
    <script src="https://proto.aalto.fi/protoflow.min.js"></script>

    <script>
        // ============================================
        // JAVASCRIPT: Making the page interactive
        // ============================================
        //
        // How this differs from viewer.html:
        // viewer.html has ONE card that shows whichever sensor sent data last.
        // This page creates ONE CARD PER SENSOR. When you pick a device, it reads
        // the list of sensors the ESP32 registered and makes a card for each.
        // If data arrives for a sensor that is not in the list yet, a new card
        // is added on the fly.

        // --- Get references to HTML elements ---
        // These let us change the page content from code
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const connectBtn = document.getElementById('connect-btn');
        const devicePicker = document.getElementById('device-picker');
        const deviceSelect = document.getElementById('device-select');
        const deviceSummary = document.getElementById('device-summary');
        const sensorGrid = document.getElementById('sensor-grid');
        const monitorLayout = document.getElementById('monitor-layout');
        const roomTemperature = document.getElementById('room-temperature');
        const roomAlarm = document.getElementById('room-alarm');
        const roomTrend = document.getElementById('room-trend');
        const trendContext = roomTrend.getContext('2d');
        const trendWindowMs = 2 * 60_000;
        const temperatureSamples = [];
        const roomBoardName = 'Room board';
        const roomDisplayName = 'Annikki1';
        const alarmBoardName = 'Alarm board';
        const hiddenSensors = new Set(['temperature_alarm', 'overheat', 'slider']);

        function showsSensorCard(name) {
            return !hiddenSensors.has(name) && !(currentDeviceName === roomDisplayName && name === 'room_temp');
        }

        function drawTrend() {
            const now = Date.now();
            const start = now - trendWindowMs;
            while (temperatureSamples.length && temperatureSamples[0].time < start) {
                temperatureSamples.shift();
            }

            const width = roomTrend.clientWidth;
            const height = roomTrend.clientHeight;
            if (!trendContext || width < 64 || !height) return;

            const scale = window.devicePixelRatio || 1;
            roomTrend.width = Math.round(width * scale);
            roomTrend.height = Math.round(height * scale);
            trendContext.scale(scale, scale);

            const left = 50;
            const right = width - 8;
            const y = value => 10 + (45 - value) / (45 - 10) * (height - 20);
            const x = time => left + (time - start) / trendWindowMs * (right - left);

            trendContext.strokeStyle = '#ddb3b1';
            trendContext.fillStyle = '#ddb3b1';
            trendContext.font = '13px system-ui';
            trendContext.textBaseline = 'middle';
            trendContext.setLineDash([5, 5]);
            trendContext.beginPath();
            for (const degrees of [15, 27]) {
                trendContext.fillText(degrees + ' °C', 2, y(degrees));
                trendContext.moveTo(left, y(degrees));
                trendContext.lineTo(right, y(degrees));
            }
            trendContext.stroke();

            trendContext.setLineDash([]);
            trendContext.strokeStyle = '#fff7f3';
            trendContext.fillStyle = '#fff7f3';
            trendContext.lineWidth = 2;
            trendContext.beginPath();
            temperatureSamples.forEach(({ time, value }, index) => {
                if (index === 0) trendContext.moveTo(x(time), y(value));
                else trendContext.lineTo(x(time), y(value));
            });
            trendContext.stroke();

            const latest = temperatureSamples.at(-1);
            if (latest) {
                trendContext.beginPath();
                trendContext.arc(x(latest.time), y(latest.value), 3, 0, Math.PI * 2);
                trendContext.fill();
            }
        }

        function resetRoomDisplay() {
            roomTemperature.textContent = 'No data yet';
            roomAlarm.textContent = 'Waiting for alarm status';
            delete monitorLayout.dataset.alarm;
            temperatureSamples.length = 0;
            drawTrend();
        }

        function showTemperatureAlarm(state) {
            roomAlarm.textContent = state === 1 ? 'Too hot' : state === -1 ? 'Too cold' : 'Normal';
            if (state === 0) delete monitorLayout.dataset.alarm;
            else monitorLayout.dataset.alarm = String(state);
        }

        function deviceName(device) {
            return device.deviceName || device.name;
        }

        function updateDeviceStatus() {
            const label = currentDeviceName === alarmBoardName
                ? 'Alarm board · Connected'
                : 'Connected to ' + currentDeviceName;
            updateStatus('connected', label);
        }

        window.addEventListener('resize', drawTrend);
        setInterval(drawTrend, 1000);
        drawTrend();

        // Track connection state
        let isConnected = false;
        let currentDevice = null;
        let currentDeviceName = '';
        let allDevices = [];     // Device list from NodeRED (includes each device's sensors)
        let cards = {};          // Sensor name → its card on the page

        // --- Sensor kinds ---
        // Each kind decides how a card looks: which display, unit and range.
        // The ESP32 tells us a sensor's type when it registers (e.g. "temperature").
        // TRY: Change a range or unit, or add your own kind!
        const SENSOR_KINDS = {
            slider:      { label: 'Slider',      display: 'bar',    unit: '%',  min: 0, max: 100, decimals: 1 },
            distance:    { label: 'Distance',    display: 'bar',    unit: 'cm', min: 0, max: 200, decimals: 1 },
            sound:       { label: 'Sound',       display: 'bar',    unit: 'dB', min: 0, max: 100, decimals: 0 },
            temperature: { label: 'Temperature', display: 'bar',    unit: '°C', min: 0, max: 50,  decimals: 1 },
            humidity:    { label: 'Humidity',    display: 'bar',    unit: '%',  min: 0, max: 100, decimals: 0 },
            button:      { label: 'Button',      display: 'button' },
            motion:      { label: 'Motion',      display: 'motion' },
            generic:     { label: 'Sensor',      display: 'value',  unit: '',   decimals: 2 }
        };

        // --- Work out the kind from the sensor type (or its name) ---
        function getSensorKind(type, name) {
            const text = ((type || '') + ' ' + (name || '')).toLowerCase();

            if (text.includes('button') || text.includes('digital')) return 'button';
            if (text.includes('pir') || text.includes('motion')) return 'motion';
            if (text.includes('temp')) return 'temperature';
            if (text.includes('humid')) return 'humidity';
            if (text.includes('ultrasonic') || text.includes('distance')) return 'distance';
            if (text.includes('sound')) return 'sound';
            if (text.includes('slider') || text.includes('rotary') ||
                text.includes('potentiometer') || text.includes('analog')) return 'slider';
            return 'generic';
        }

        // --- Make units from the ESP32 look nice ---
        function prettyUnit(unit) {
            if (unit === 'celsius') return '°C';
            if (unit === 'fahrenheit') return '°F';
            return unit;
        }

        // --- Update status display ---
        function updateStatus(state, message) {
            statusDot.className = 'status-dot ' + state;
            statusText.textContent = message;
        }

        // --- Remove all sensor cards ---
        function clearCards() {
            sensorGrid.innerHTML = '';
            cards = {};
        }

        // --- Show "Device: X · N sensors" above the cards ---
        function updateSummary() {
            const count = Object.keys(cards).length + (currentDeviceName === roomDisplayName ? 1 : 0);
            if (currentDeviceName === alarmBoardName) {
                deviceSummary.textContent = 'Alarm board receives commands. Select Annikki1 for live temperature.';
                deviceSummary.classList.add('visible');
                return;
            }
            deviceSummary.textContent = count === 0
                ? currentDeviceName + ' · Waiting for your sensors to send data...'
                : currentDeviceName + ' · ' + count + (count === 1 ? ' sensor' : ' sensors');
            deviceSummary.classList.add('visible');
        }

        // --- Small helper: create an element with a class and text ---
        function makeElement(tag, className, text) {
            const el = document.createElement(tag);
            if (className) el.className = className;
            if (text !== undefined) el.textContent = text;
            return el;
        }

        // --- Create one card for one sensor ---
        // sensor = { name, type, unit, min_value, max_value } from the device list
        function createCard(sensor) {
            const kindName = getSensorKind(sensor.type, sensor.name);
            const kind = SENSOR_KINDS[kindName];

            // Use the range and unit the ESP32 registered, if it sent them
            const hasRange = typeof sensor.min_value === 'number' &&
                             typeof sensor.max_value === 'number' &&
                             sensor.max_value > sensor.min_value;
            const card = {
                kind: kind,
                min: hasRange ? sensor.min_value : kind.min,
                max: hasRange ? sensor.max_value : kind.max,
                unit: sensor.unit ? prettyUnit(sensor.unit) : (kind.unit || '')
            };

            // The card box
            const box = makeElement('div', 'card kind-' + kindName);
            box.appendChild(makeElement('span', 'sensor-badge', kindName === 'generic' && sensor.type ? sensor.type : kind.label));
            box.appendChild(makeElement('p', 'card-title', sensor.name));

            // The display inside the card depends on the kind
            if (kind.display === 'bar' || kind.display === 'value') {
                // Big number + unit
                const valueRow = makeElement('div', 'value-display');
                card.valueEl = makeElement('span', '', '--');
                valueRow.appendChild(card.valueEl);
                valueRow.appendChild(makeElement('span', 'value-unit', card.unit));
                box.appendChild(valueRow);
                card.valueRow = valueRow;

                // Progress bar with min and max labels
                if (kind.display === 'bar') {
                    const bar = makeElement('div', 'progress-bar');
                    card.fillEl = makeElement('div', 'progress-fill');
                    bar.appendChild(card.fillEl);
                    box.appendChild(bar);

                    const labels = makeElement('div', 'range-labels');
                    labels.appendChild(makeElement('span', '', card.min + ' ' + card.unit));
                    labels.appendChild(makeElement('span', '', card.max + ' ' + card.unit));
                    box.appendChild(labels);
                }
            } else if (kind.display === 'button') {
                const state = makeElement('div', 'button-state');
                card.indicatorEl = makeElement('div', 'button-indicator', 'RELEASED');
                state.appendChild(card.indicatorEl);
                box.appendChild(state);
            } else if (kind.display === 'motion') {
                card.indicatorEl = makeElement('div', 'motion-indicator');
                card.indicatorEl.appendChild(makeElement('div', 'motion-icon', '👁️'));
                card.textEl = makeElement('div', 'motion-text', 'No motion');
                card.indicatorEl.appendChild(card.textEl);
                box.appendChild(card.indicatorEl);
            }

            // When was the last value received?
            card.timeEl = makeElement('div', 'device-info', 'Waiting for data...');
            box.appendChild(card.timeEl);

            card.box = box;
            sensorGrid.appendChild(box);
            cards[sensor.name] = card;
            updateSummary();
            return card;
        }

        // --- Update one card with a new value ---
        function updateCard(card, value) {
            const kind = card.kind;

            if (kind.display === 'bar') {
                const number = typeof value === 'number' ? value : parseFloat(value) || 0;
                card.valueEl.textContent = number.toFixed(kind.decimals);
                // Turn the value into a 0-100% bar width
                const percent = ((number - card.min) / (card.max - card.min)) * 100;
                card.fillEl.style.width = Math.max(0, Math.min(100, percent)) + '%';
            }
            else if (kind.display === 'button') {
                const pressed = value === 1 || value === true || value === '1';
                card.indicatorEl.textContent = pressed ? 'PRESSED' : 'RELEASED';
                card.indicatorEl.className = 'button-indicator' + (pressed ? ' pressed' : '');
            }
            else if (kind.display === 'motion') {
                const detected = value === 1 || value === true || value === '1';
                card.indicatorEl.className = 'motion-indicator' + (detected ? ' detected' : '');
                card.textEl.textContent = detected ? 'MOTION DETECTED!' : 'No motion';
            }
            else {
                // Generic: numbers get decimals, objects (like IMU data) are shown as text
                if (typeof value === 'number') {
                    card.valueRow.classList.remove('small');
                    card.valueEl.textContent = value.toFixed(kind.decimals);
                } else if (typeof value === 'object' && value !== null) {
                    card.valueRow.classList.add('small');
                    card.valueEl.textContent = JSON.stringify(value, null, 1);
                } else {
                    card.valueEl.textContent = String(value);
                }
            }

            card.timeEl.textContent = 'Last update: ' + new Date().toLocaleTimeString();

            // Flash the card border so you can see which sensor just changed
            card.box.classList.add('updated');
            clearTimeout(card.flashTimer);
            card.flashTimer = setTimeout(() => card.box.classList.remove('updated'), 300);
        }

        // --- Connect Button Handler ---
        connectBtn.addEventListener('click', () => {
            if (!isConnected) {
                // Start connecting
                updateStatus('connecting', 'Connecting...');
                connectBtn.disabled = true;
                ProtoFlow.connect();
            } else {
                // Disconnect
                ProtoFlow.disconnect();
                isConnected = false;
                currentDevice = null;
                resetRoomDisplay();
                updateStatus('', 'Disconnected');
                connectBtn.textContent = 'Connect';
                devicePicker.classList.remove('visible');
                deviceSummary.classList.remove('visible');
                clearCards();
            }
        });

        // --- Device Selection Handler ---
        deviceSelect.addEventListener('change', (e) => {
            const uuid = e.target.value;
            if (!uuid) return;

            // Find device info
            const option = deviceSelect.options[deviceSelect.selectedIndex];
            const device = allDevices.find(d => d.uuid === uuid);

            // IMPORTANT: Unsubscribe from previous device before subscribing to new one
            if (currentDevice && currentDevice !== uuid) {
                ProtoFlow.unsubscribeFromDevice(currentDevice);
            }

            if (currentDevice !== uuid) resetRoomDisplay();
            currentDevice = uuid;
            currentDeviceName = option.textContent;
            updateDeviceStatus();

            // Make one card for every sensor this device registered
            clearCards();
            const sensors = (device && device.sensors) || [];
            console.log(`[CARDS] ${currentDeviceName} has ${sensors.length} sensors:`, sensors.map(s => s.name));
            sensors.filter(sensor => showsSensorCard(sensor.name)).forEach(sensor => createCard(sensor));
            updateSummary();
            ProtoFlow.subscribeToDevice(uuid);
        });

        // --- ProtoFlow Event Handlers ---

        // When connected and registered
        ProtoFlow.on('connect', () => {
            isConnected = true;
            updateStatus('connected', 'Connected! Select your device');
            connectBtn.textContent = 'Disconnect';
            connectBtn.disabled = false;
        });

        // When device list is received
        ProtoFlow.on('devices', (devices) => {
            allDevices = devices;

            // Clear and populate device dropdown
            deviceSelect.innerHTML = '<option value="">Select your device...</option>';

            devices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.uuid;
                const name = deviceName(device);
                option.textContent = name === roomBoardName ? roomDisplayName : name || device.uuid.substring(0, 8);
                deviceSelect.appendChild(option);
            });

            // Show device picker
            devicePicker.classList.add('visible');

            // Keep the current device selected if it is still in the list
            const roomBoard = devices.find(device => deviceName(device) === roomBoardName);
            const current = devices.find(d => d.uuid === currentDevice);
            if (current && (deviceName(current) !== alarmBoardName || !roomBoard)) {
                deviceSelect.value = currentDevice;
                updateDeviceStatus();
                // Subscribe again (needed after an automatic reconnect; harmless otherwise)
                ProtoFlow.subscribeToDevice(currentDevice);
                // Add cards for any sensors the device registered since we last looked
                (current.sensors || []).forEach(sensor => {
                    if (showsSensorCard(sensor.name) && !cards[sensor.name]) createCard(sensor);
                });
                return;
            }

            if (currentDevice) {
                ProtoFlow.unsubscribeFromDevice(currentDevice);
                currentDevice = null;
                resetRoomDisplay();
                clearCards();
                deviceSummary.classList.remove('visible');
            }
            updateStatus('connected', devices.length ? 'Connected · Select a device' : 'Connected · No devices found');

            const defaultDevice = roomBoard || (devices.length === 1 ? devices[0] : null);
            if (defaultDevice) {
                deviceSelect.value = defaultDevice.uuid;
                deviceSelect.dispatchEvent(new Event('change'));
            }
        });

        // When sensor data is received
        ProtoFlow.on('sensor', (data) => {
            console.log(`[SENSOR] ${data.sensor} = ${JSON.stringify(data.value)}`);

            // Only process if it's from our subscribed device
            if (data.device !== currentDevice) return;

            if (currentDeviceName === roomDisplayName) {
                if (data.sensor === 'room_temp' && Number.isFinite(data.value)) {
                    roomTemperature.textContent = data.value.toFixed(1) + ' °C';
                    temperatureSamples.push({ time: Date.now(), value: data.value });
                    drawTrend();
                }
                if (data.sensor === 'temperature_alarm' && [-1, 0, 1].includes(data.value)) {
                    showTemperatureAlarm(data.value);
                }
            }

            // Find this sensor's card, or make a new one if we have not seen it yet
            if (!showsSensorCard(data.sensor)) return;
            const card = cards[data.sensor] || createCard({ name: data.sensor });

            // Update the value
            updateCard(card, data.value);
        });

        // When disconnected
        ProtoFlow.on('disconnect', () => {
            isConnected = false;
            resetRoomDisplay();
            updateStatus('', 'Disconnected');
            connectBtn.textContent = 'Connect';
            connectBtn.disabled = false;
            devicePicker.classList.remove('visible');
        });

        // When error occurs
        ProtoFlow.on('error', (error) => {
            console.error('ProtoFlow error:', error);
            updateStatus('', 'Error: ' + error.message);
            connectBtn.disabled = false;
        });
    </script>
</body>
</html>
